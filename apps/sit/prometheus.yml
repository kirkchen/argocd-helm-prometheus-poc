apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-sit
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kirkchen/argocd-helm-prometheus-poc
    targetRevision: HEAD
    path: base/kube-prometheus-stack
    helm:
      valueFiles:
        - values.yaml
        - ../../overlays/sit/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring-sit
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
