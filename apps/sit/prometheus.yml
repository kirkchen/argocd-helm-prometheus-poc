apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kirkchen/argocd-helm-prometheus-poc
    targetRevision: HEAD
    path: overlays/staging
    helm:
      valueFiles:
        - ../../base/kube-prometheus-stack/values.yaml
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
